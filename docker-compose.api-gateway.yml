name : traefik
services:
  traefik:
    command: 
      - '--api=true'
      - '--api.dashboard=true'
      - '--log.level=DEBUG'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.traefik.address=:8080'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--certificatesresolvers.cert-resolver.acme.httpchallenge=true'
      - '--certificatesresolvers.cert-resolver.acme.httpchallenge.entrypoint=web'
      - '--certificatesresolvers.cert-resolver.acme.email=jamesgurung690@gmail.com'
      - '--certificatesresolvers.cert-resolver.acme.storage=/letsencrypt/acme.json'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './certificates/letsencrypt:/letsencrypt'
    ports:
      - '80:80'
      - '443:443'
    networks:
      - traefik

networks:
  traefik:
    name: traefik